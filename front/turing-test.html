<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Chat Minerv@s - SNCT</title>
</head>
<body>
  <div id="chatContainer" class="chat-container"></div>

  <div id="loadingSpinner" style="display: none; margin-top: 10px;">
      <img src="./assets/loading.svg" alt="loadingSpinner" />
  </div>

  <div class="input-area">
      <input id="userInput" type="text" placeholder="Digite sua mensagem..." />
      <button id="sendButton">Enviar</button>
  </div>

  <button id="guessButton" onclick="window.location = 'form.html'">Quem está falando?</button>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>

</html>

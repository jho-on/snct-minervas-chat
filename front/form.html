<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Chat Minerv@s - SNCT</title>
</head>
<body>
    <form id="turingForm">
        <h2>Com quem você estava conversando?</h2>
        <label>
            Você acha que estava conversando com:
            <select name="guess" required>
            <option value="">Selecione</option>
            <option value="AI">IA</option>
            <option value="Humano">Humano</option>
            </select>
        </label>
        <br>
        <label>
            Por quê?
            <textarea name="reason" placeholder="Explique seu palpite..."></textarea>
        </label>
        <br>
        <button type="submit">Enviar Resposta</button>
    </form>

    <script src="turing-test.js"></script>
</body>
</html>
